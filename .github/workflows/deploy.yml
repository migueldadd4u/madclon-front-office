name: Deploy Front Office a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/public/data/**"
      # El primer merge que reactiva este trigger también debe desplegar el
      # lote de datos que ya esté en main.
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASEPATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install
        working-directory: web
        run: yarn install --frozen-lockfile --non-interactive

      - name: Public safety regressions
        working-directory: web
        run: yarn test:public-safety

      - name: Public safety gate (source)
        working-directory: web
        run: yarn check:public-safety

      # Contrato datos↔web: la historia debe llegar por JSON y la flota no puede
      # crecer sin marca. Informativo a propósito: una rotura de contrato se ve
      # en el run, pero NUNCA congela la publicación del lote de datos fresco.
      - name: Contrato datos ↔ web (informativo)
        working-directory: web
        continue-on-error: true
        run: yarn check:contrato

      - name: Build (export estático)
        working-directory: web
        run: yarn build

      - name: Public safety gate (export)
        working-directory: web
        run: yarn check:public-safety:out

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
