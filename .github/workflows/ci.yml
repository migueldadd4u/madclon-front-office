name: CI (pruebas, sin desplegar)

# Las mismas pruebas que exige el despliegue, en cualquier rama y en cada PR,
# para ver el rojo antes de llegar a main. Este workflow no construye ni publica:
# solo lee el repo.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install
        working-directory: web
        run: yarn install --frozen-lockfile --non-interactive

      # Lista en el script `test` de web/package.json. Fuera queda
      # esperas.test.mjs: abre un navegador instalado fuera del repo y lo corre el
      # gate local (motivo registrado en scripts/suite-ci.test.mjs).
      - name: Pruebas herméticas (privacidad, contrato, copy, tema, CI)
        working-directory: web
        run: yarn test

      # TODO: cuando exista la prueba del exportador principal (export_panel.py),
      # añadirla aquí y en deploy.yml si es hermética.
      - name: Pruebas del exportador (hardware y retos)
        run: python3 -m unittest discover -s exporter -p 'test_*publico*.py'
